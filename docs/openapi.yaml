openapi: 3.1.0
info:
  title: Task API
  version: 1.0.0
servers:
  - url: /
    description: Current server (local or deployed)
  - url: https://onorman-task-api.onrender.com
    description: Render production server
  - url: http://localhost:3000
    description: Local development servers
tags:
  - name: Tasks
    description: Task-related endpoints
  - name: Monitoring
    description: Operational endpoints, such as health checks
paths:
  /tasks:
    get:
      summary: List tasks
      description: Return all tasks when completed is omitted, or filter by completion status.
      tags:
        - Tasks
      parameters:
        - name: completed
          in: query
          required: false
          description: Use true for completed tasks or false for incomplete tasks. Omit to return all tasks. Only the exact values true and false are accepted; empty, repeated, and other values return 400.
          schema:
            type: boolean
          examples:
            completedTasks:
              summary: Completed tasks
              value: true
            incompleteTasks:
              summary: Incomplete tasks
              value: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          description: The completed query parameter is invalid.
          content:
            application/json:
              schema:
                type: object
                required: [error, details]
                properties:
                  error:
                    type: string
                  details:
                    type: array
                    items:
                      type: string
              example:
                error: Validation failed
                details:
                  - completed must be true or false
    post:
      summary: Create a new task
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Bad request due to invalid data
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  details:
                    type: array
                    items:
                      type: string
                example:
                  errors:
                    - 'Title must be at least 3 characters'
  /health:
    get:
      summary: Health Check
      description: Returns the current status of the API. Used by Render to verify that the service is running.
      tags:
        - Monitoring
      responses:
        '200':
          description: API is running successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
components:
  schemas:
    Task:
      type: object
      properties:
        id:
          readOnly: true
          type: integer
          example: 1
        title:
          type: string
          example: Buy groceries
        completed:
          type: boolean
          example: false
